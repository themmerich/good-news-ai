<svg
  xmlns="http://www.w3.org/2000/svg"
  [attr.viewBox]="wordmark() ? '0 0 205 40' : '0 0 40 40'"
  class="h-full w-auto"
  role="img"
  aria-label="good news ai"
>
  <!-- The mark: a rounded tile with a spark, big and small. -->
  <rect width="40" height="40" rx="10" [attr.fill]="onPrimary() ? 'var(--p-primary-contrast-color)' : 'var(--p-primary-color)'" />
  <g [attr.fill]="onPrimary() ? 'var(--p-primary-color)' : 'var(--p-primary-contrast-color)'">
    <path d="M18.5 8.5 21.2 17.3 30 20l-8.8 2.7-2.7 8.8-2.7-8.8L7 20l8.8-2.7z" />
    <path d="m29.5 8 1.1 3.4L34 12.5l-3.4 1.1-1.1 3.4-1.1-3.4L25 12.5l3.4-1.1z" />
  </g>
  @if (wordmark()) {
    <!-- The wordmark takes the page's text colour and font. -->
    <text x="50" y="27.5" font-family="inherit" font-size="23" font-weight="600" letter-spacing="-0.4" fill="currentColor">
      good news ai
    </text>
  }
</svg>
