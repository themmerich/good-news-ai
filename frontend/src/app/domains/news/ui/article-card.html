<ng-container *transloco="let t">
  <article class="flex flex-col gap-2 rounded-lg border border-surface-200 p-4 dark:border-surface-700">
    <div class="flex flex-wrap items-start gap-2">
      <h3 class="m-0 text-base font-semibold">
        <a [href]="article().link" target="_blank" rel="noopener noreferrer" class="underline">{{ article().title }}</a>
      </h3>
      @if (article().ranking !== null) {
        <span
          class="ml-auto rounded-full bg-primary px-2 py-0.5 text-sm font-semibold text-primary-contrast"
          [attr.aria-label]="t('board.rankingLabel', { ranking: article().ranking })"
          >{{ article().ranking }}</span
        >
      } @else {
        <span class="ml-auto text-xs text-surface-500 dark:text-surface-400">{{ t('board.notRated') }}</span>
      }
    </div>

    @if (article().teaser) {
      <p class="m-0 text-sm text-surface-600 dark:text-surface-300">{{ article().teaser }}</p>
    }

    <p class="m-0 text-xs text-surface-500 dark:text-surface-400">
      {{ article().sourceName }}
      @if (article().publishedAt; as publishedAt) {
        · {{ publishedAt | date: 'short' }}
      }
    </p>
  </article>
</ng-container>
