<!doctype html>
<html lang="de">
  <head>
    <title>Aufstieg — Beispiel Nachrichten</title>
    <!-- name= where the standard says property=. Plenty of sites do this, and it means the same. -->
    <meta name="og:title" content="Aufstieg in letzter Minute" />
    <meta name="og:description" content="Ein Tor in der Nachspielzeit entscheidet die Saison." />
    <!-- A date nobody can parse; the article is worth keeping without one. -->
    <meta name="article:published_time" content="gestern Abend" />
  </head>
  <body>
    <h1>Aufstieg in letzter Minute</h1>
  </body>
</html>
