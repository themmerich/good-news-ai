spring.application.name=good-news-ai

# Flyway owns the schema; Hibernate only validates its mapping against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Sessions live in PostgreSQL (Spring Session JDBC); the tables come from a
# Flyway migration, so Spring Session's own schema initializer stays off.
spring.session.jdbc.initialize-schema=never

# Uploads: every endpoint enforces its own ceiling (a profile picture 2 MB, a
# company logo 2 MB), and these must not cut in below the largest of them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# The model the AI calls use. The key itself is never in the repo: it goes into
# the git-ignored application-local.properties (see the .example beside it), or
# a tenant brings its own on the KI-Zugang page.
spring.ai.anthropic.chat.options.model=claude-sonnet-5
spring.ai.anthropic.chat.options.max-tokens=1024

# The first super-user, created at startup when both are set and no super-user
# exists yet. Deliberately without defaults: a deployment sets them once, from
# the environment, and may unset them after the first start. The dev profile
# seeds a demo super-user instead (super / secret), so these stay empty there.
# goodnews.auth.superuser.username=
# goodnews.auth.superuser.password=

# Key material for the secrets the app stores on a tenant's behalf (today the
# tenant's own AI key). Deliberately without a default: a shipped key is no key,
# and the application refuses to start rather than encrypt with a value that
# stands in the repository. The dev profile supplies its own pair; every real
# deployment sets these two, e.g. from the environment.
#
# Both belong together and must not change after the first save — a different
# secret or salt makes every stored secret unreadable. Generate a salt with
# org.springframework.security.crypto.keygen.KeyGenerators.string().
# goodnews.crypto.secret=
# goodnews.crypto.salt=
